# Compliance controller configuration for OpenArm right arm
# This controller computes and writes:
#   - tau_ff (gravity + friction + coriolis compensation)
#   - dynamic Kp/Kd (stiffness/damping)
#
# It coexists with JointTrajectoryController which writes position + velocity.

right_compliance_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7

    root_link: "openarm_body_link0"
    tip_link: "openarm_right_hand"

    # Calibration: scale factors from hardware validation (Step 3)
    # J2: model overpredicts by ~4%, J4: model overpredicts by ~33%
    tau_ff_scale: [1.0, 0.96, 1.0, 0.67, 1.0, 1.0, 1.0]

    # Friction model: tau_f = Fc*tanh(0.1*k*dq) + Fv*dq + Fo
    # From openarm_teleop calibration (follower.yaml)
    friction:
      Fc: [0.306,   0.306,   0.40,    0.166,   0.050,   0.093,   0.172]
      k:  [28.417,  28.417,  29.065,  130.038, 151.771, 242.287, 7.888]
      Fv: [0.063,   0.063,   0.604,   0.813,   0.029,   0.072,   0.084]
      Fo: [0.088,   0.088,   0.008,  -0.058,   0.005,   0.009,  -0.059]

    # Default gains (startup values = current conservative defaults)
    kp_default: [70.0, 70.0, 70.0, 60.0, 10.0, 10.0, 10.0]
    kd_default: [2.75, 2.5, 2.0, 2.0, 0.7, 0.6, 0.5]

    # Upper bounds: Damiao MIT mode supports Kp=[0,500], Kd=[0,5]
    # Set ~2x defaults for safe tuning headroom
    kp_max: [150.0, 150.0, 150.0, 120.0, 30.0, 30.0, 30.0]
    kd_max: [5.0, 5.0, 5.0, 5.0, 2.0, 2.0, 2.0]

    # Lower bounds: safety floor (matches hardware kp_min/kd_min)
    kp_min: [15.0, 15.0, 15.0, 12.0, 3.0, 3.0, 3.0]
    kd_min: [0.5, 0.5, 0.4, 0.4, 0.15, 0.12, 0.1]

    # Rate limiting: max change per update cycle (100 Hz)
    # ΔKp = 2.0/cycle → full range sweep in ~35 cycles (0.35s)
    delta_kp_max: 2.0
    delta_kd_max: 0.1

