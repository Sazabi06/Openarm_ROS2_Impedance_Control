    gripper_kp_default: 5.0     # must match GRIPPER_KP in HW driver
    gripper_kd_default: 0.1     # must match GRIPPER_KD in HW driver
    gripper_kp_max: 10.0
    gripper_kd_max: 2.0

    # Teach mode preset (Task 3.2s)
    teach_mode:
      kp: [15.0, 15.0, 15.0, 12.0, 3.0, 3.0, 3.0]
      kd: [0.5, 0.5, 0.4, 0.4, 0.15, 0.12, 0.1]
      grip_kp: 0.3
      grip_kd: 0.05
